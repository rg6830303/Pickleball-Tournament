name: Supabase Setup

# Applies supabase/setup-all.sql to the live Supabase project:
# registration schema, auction schema, RLS, storage, the organiser login
# and all 16 captain logins. The script is idempotent, so re-running is safe.
#
# ── ONE-TIME PREREQUISITE ────────────────────────────────────────────
# Add a repository secret named SUPABASE_DB_URL:
#   GitHub → Settings → Secrets and variables → Actions → New repository secret
#   Name:  SUPABASE_DB_URL
#   Value: your Supabase "Session pooler" connection string, e.g.
#          postgres://postgres.<project-ref>:<db-password>@aws-0-<region>.pooler.supabase.com:5432/postgres?sslmode=require
#   (Supabase → Project Settings → Database → Connection string → Session pooler)
#
# OPTIONAL second secret ADMIN_PASSWORD — the organiser console password.
# If set, the workflow creates/resets ishanvashistha.1993@gmail.com to it.
# If not set, the organiser login is skipped; create it from the console's
# "Set up my login" panel instead.
#
# NOTE: this repository is public, so workflow logs are public too.
# Nothing here ever prints a password. Captain passwords are generated by
# the SQL directly into the staff-only auction_team_logins table and are
# read from Organiser Console → Auction → Team Logins.
# ─────────────────────────────────────────────────────────────────────

on:
  workflow_dispatch:
    inputs:
      verify_only:
        description: "Only run the verification checks (do not modify the database)"
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - "supabase/**.sql"
      - ".github/workflows/supabase-setup.yml"

concurrency:
  group: supabase-setup
  cancel-in-progress: false

jobs:
  setup:
    name: Apply schema & seed logins
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client
          psql --version

      - name: Check the connection secret is present
        id: precheck
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$DB_URL" ]; then
            # NEVER report success when the work did not happen. A green run
            # that silently skipped is worse than a red one: it looks done.
            echo "::error::SUPABASE_DB_URL is not set - NOTHING was applied to Supabase."
            {
              echo "# ❌ NOTHING WAS APPLIED"
              echo
              echo "This run did **not** touch the database. The repository secret"
              echo "\`SUPABASE_DB_URL\` is missing, so there is nothing to connect to."
              echo
              echo "## Fix it (about 30 seconds)"
              echo
              echo "1. **Settings → Secrets and variables → Actions → New repository secret**"
              echo "2. Name: \`SUPABASE_DB_URL\`"
              echo "3. Value: Supabase → Project Settings → Database → Connection string →"
              echo "   **Session pooler** — it looks like:"
              echo
              echo '   ```'
              echo '   postgres://postgres.<project-ref>:<db-password>@aws-0-<region>.pooler.supabase.com:5432/postgres?sslmode=require'
              echo '   ```'
              echo
              echo "   Use the **Session pooler** string, not the direct \`db.*.supabase.co\` one —"
              echo "   GitHub runners are IPv4-only and the direct host is IPv6-only."
              echo "4. Re-run this workflow."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "has_secret=true" >> "$GITHUB_OUTPUT"
          echo "Secret is present."

      - name: Verify database connectivity
        if: ${{ steps.precheck.outputs.has_secret == 'true' }}
        env:
          PGCONN: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          echo "Connecting to Supabase…"
          psql "$PGCONN" -v ON_ERROR_STOP=1 -tAc \
            "select 'connected to ' || current_database() || ' as ' || current_user"

      - name: Apply setup-all.sql
        if: ${{ steps.precheck.outputs.has_secret == 'true' && inputs.verify_only != true }}
        env:
          PGCONN: ${{ secrets.SUPABASE_DB_URL }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: |
          set -euo pipefail
          # Inject the organiser password as a session setting so it never
          # has to live in the repository. Escape single quotes for SQL.
          if [ -n "${ADMIN_PASSWORD:-}" ]; then
            ESCAPED=$(printf '%s' "$ADMIN_PASSWORD" | sed "s/'/''/g")
            printf "set mpl.admin_password = '%s';\n" "$ESCAPED" > /tmp/run.sql
          else
            echo "-- no ADMIN_PASSWORD secret; organiser login will be skipped" > /tmp/run.sql
          fi
          cat supabase/setup-all.sql >> /tmp/run.sql

          # Never echo the file: it holds the organiser password for this run.
          psql "$PGCONN" -v ON_ERROR_STOP=1 -f /tmp/run.sql > /tmp/apply.log 2>&1 || {
            echo "::error::Applying the schema failed:"; sed "s/${ADMIN_PASSWORD:-__none__}/***/g" /tmp/apply.log; exit 1;
          }
          sed "s/${ADMIN_PASSWORD:-__none__}/***/g" /tmp/apply.log | tail -40
          shred -u /tmp/run.sql 2>/dev/null || rm -f /tmp/run.sql
          echo "Schema applied."

      - name: Verify installation
        if: ${{ steps.precheck.outputs.has_secret == 'true' }}
        env:
          PGCONN: ${{ secrets.SUPABASE_DB_URL }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: |
          set -euo pipefail

          # --- object inventory ---
          psql "$PGCONN" -v ON_ERROR_STOP=1 -P pager=off -c "
            select 'tables'   as item, count(*)::text as value from pg_tables where schemaname='public'
            union all select 'auction RPCs', count(*)::text from pg_proc p
              join pg_namespace n on n.oid=p.pronamespace
              where n.nspname='public' and p.proname like 'auction%'
            union all select 'tables with RLS', count(*)::text from pg_tables t
              join pg_class c on c.relname=t.tablename where t.schemaname='public' and c.relrowsecurity
            union all select 'policies', count(*)::text from pg_policies where schemaname in ('public','storage')
            union all select 'storage buckets', count(*)::text from storage.buckets where id='registrations'
            union all select 'teams', count(*)::text from public.auction_teams
            union all select 'registrations (untouched)', count(*)::text from public.registrations;
          " | tee /tmp/inventory.txt

          # --- captain logins: every row must read OK ---
          psql "$PGCONN" -v ON_ERROR_STOP=1 -P pager=off -c "
            select l.username, l.email,
              case
                when u.id is null then 'MISSING ACCOUNT'
                when u.email_confirmed_at is null then 'EMAIL NOT CONFIRMED'
                when t.auth_user_id is distinct from u.id then 'NOT LINKED TO TEAM'
                when u.encrypted_password <> crypt(l.password, u.encrypted_password) then 'PASSWORD MISMATCH'
                else 'OK'
              end as status
            from public.auction_team_logins l
            left join auth.users u on u.email = l.email
            left join public.auction_teams t on t.id = l.team_id
            order by l.team_id;
          " | tee /tmp/logins.txt

          # --- hard assertions ---
          BAD=$(psql "$PGCONN" -v ON_ERROR_STOP=1 -tAc "
            select count(*) from public.auction_team_logins l
            left join auth.users u on u.email = l.email
            left join public.auction_teams t on t.id = l.team_id
            where u.id is null
               or u.email_confirmed_at is null
               or t.auth_user_id is distinct from u.id
               or u.encrypted_password <> crypt(l.password, u.encrypted_password);
          ")
          TOTAL=$(psql "$PGCONN" -tAc "select count(*) from public.auction_team_logins;")
          if [ -n "${ADMIN_PASSWORD:-}" ]; then
            ADMIN_OK=$(psql "$PGCONN" -tAc "
              select count(*) from auth.users
              where email='ishanvashistha.1993@gmail.com'
                and encrypted_password = crypt('$(printf '%s' "$ADMIN_PASSWORD" | sed "s/'/''/g")', encrypted_password)
                and email_confirmed_at is not null;
            ")
          else
            ADMIN_OK=skip
          fi

          {
            echo "## Supabase setup result"
            echo
            echo '### Inventory'
            echo '```'
            cat /tmp/inventory.txt
            echo '```'
            echo '### Captain logins'
            echo '```'
            cat /tmp/logins.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          FAILED=0
          if [ "$TOTAL" -ne 16 ]; then
            echo "::error::Expected 16 captain logins, found $TOTAL"; FAILED=1
          fi
          if [ "$BAD" -ne 0 ]; then
            echo "::error::$BAD captain login(s) failed verification"; FAILED=1
          fi
          if [ "$ADMIN_OK" = "skip" ]; then
            echo "::warning::ADMIN_PASSWORD secret not set - organiser login was not created or checked."
          elif [ "$ADMIN_OK" -ne 1 ]; then
            echo "::error::Organiser login did not verify"; FAILED=1
          fi

          if [ "$FAILED" -eq 1 ]; then
            echo "❌ Verification failed — see the errors above." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          {
            echo
            echo "✅ **All 16 captain logins verified**, organiser login verified."
            echo
            echo "Captains sign in at <https://monsoonpickleauction.vercel.app> with usernames \`Team1\`…\`Team16\`."
            echo "Passwords were generated into the staff-only table and are visible in"
            echo "the Organiser Console → **Auction → Team Logins** (never printed here)."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "All checks passed."
